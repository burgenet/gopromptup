services:
  gopromptup-backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install; npm start"
    environment:
      - PORT=3010
      - REDIS_URL=redis://redis:6379
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ./backend:/app
      - gopromptup_backend_modules:/app/node_modules
    ports:
      - '3010:3010'
    depends_on:
      - redis

  gopromptup-frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install; npm run dev"
    environment:
      - API_PROXY_TARGET=http://gopromptup-backend:3010
    volumes:
      - ./frontend:/app
      - gopromptup_frontend_modules:/app/node_modules
    ports:
      - '5173:5173'

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6381:6379'
    volumes:
      - gopromptup_redis_data:/data

volumes:
  gopromptup_backend_modules:
  gopromptup_frontend_modules:
  gopromptup_redis_data:
